name: daily

on:
  schedule:
    # 평일 15:40 UTC = 뉴욕 10:40 (겨울) / 11:40 (서머타임). 스캔은 항상 10:15 기준으로 잘라서 봅니다.
    - cron: "40 15 * * 1-5"
  workflow_dispatch:
    inputs:
      demo:
        description: "원문 예시(TSLA 2026-10-19)를 저장된 데이터로 돌리기"
        type: boolean
        default: false
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the skills (scanner → exit → time machine → news)
        if: github.event_name != 'push'
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            python3 pipeline/run_daily.py --demo
          else
            python3 pipeline/run_daily.py
          fi

      - name: Save the results
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d) run"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
