name: daily

on:
  schedule:
    # 평일 15:40 UTC = 뉴욕 10:40 (겨울) / 11:40 (서머타임). 스캔은 항상 10:15 기준으로 잘라서 봅니다.
    - cron: "40 15 * * 1-5"
  workflow_dispatch:
    inputs:
      demo:
        description: "원문 예시(TSLA 2026-10-19)를 저장된 데이터로 돌리기"
        type: boolean
        default: false
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the skills (scanner → exit → time machine → news)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 코드만 바뀐 푸시는 다시 배포만. 데이터가 아직 하나도 없으면 원문 예시(데모)로 첫 화면을 채웁니다.
            [ -f site/data/index.json ] || python3 pipeline/run_daily.py --demo
          elif [ "${{ inputs.demo }}" = "true" ]; then
            python3 pipeline/run_daily.py --demo
          else
            python3 pipeline/run_daily.py
          fi

      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d) run"
          git push

      # site/ 폴더를 gh-pages 브랜치로 올리면 GitHub Pages가 그 브랜치를 보여 줍니다.
      - name: Publish site/ to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
