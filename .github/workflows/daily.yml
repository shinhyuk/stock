name: daily

on:
  schedule:
    # 장이 닫혀 있을 때 수동 실행하면 가장 최근 장(지난 6일 안)을 돌립니다.
    # 평일 15:40 UTC = 뉴욕 10:40 (겨울) / 11:40 (서머타임). 스캔은 항상 10:15 기준으로 잘라서 봅니다.
    - cron: "40 15 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "직접 고른 종목만 (쉼표로, 예: NVDA,PLTR,SOFI). 비우면 아래 범위대로"
        type: string
        default: ""
      scope:
        description: "스캔 범위"
        type: choice
        options: ["all — 미국 전체 (~5,900)", "list — pipeline/universe.txt", "demo — 원문 예시 (TSLA 2026-10-19)"]
        default: "all — 미국 전체 (~5,900)"
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the skills (scanner → exit → time machine → news)
        env:
          EVENT: ${{ github.event_name }}
          TICKERS: ${{ inputs.tickers }}
          SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # 코드만 바뀐 푸시는 다시 배포만. 실제 장 결과가 아직 하나도 없으면 가장 최근 장으로 한 번 돌립니다.
            ls site/data/days 2>/dev/null | grep -qv demo || python3 pipeline/run_daily.py
          elif [ -n "$TICKERS" ]; then
            python3 pipeline/run_daily.py --tickers "$TICKERS"
          else
            case "$SCOPE" in
              demo*) python3 pipeline/run_daily.py --demo ;;
              list*) python3 pipeline/run_daily.py --list ;;
              *)     python3 pipeline/run_daily.py ;;
            esac
          fi

      - name: Save the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d) run"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
